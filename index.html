<!--
  DUNIN7 operating-account domain — landing page mockup v0.1
  dunin7.com
  2026-05-16

  Minimal landing page for the operating-account apex. Wordmark + outbound
  link to doneinseven.com. Signals domain ownership; directs any curious
  visitor to the substantive product-family site.

  dunin7.com is the operating-account domain (Marvin's email, foraychallenge
  subdomain). doneinseven.com is the public product-family root. This page
  is functionally a directory pointer, not a marketing surface.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DUNIN7 — dunin7.com landing mockup v0.1</title>
  <meta name="description" content="DUNIN7 — Done In Seven LLC. Miami, Florida.">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #FAF9F7;
      --text-primary: #1A1A1A;
      --text-secondary: #4A4A4A;
      --text-muted: #7A7A7A;
      --accent: #2A3F5F;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      font-size: 17px;
      background: var(--bg);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 56px;
      padding: 48px 24px;
    }

    .wordmark {
      font-family: "IBM Plex Serif", "Source Serif Pro", Georgia, serif;
      font-size: 104px;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1;
      color: var(--text-primary);
    }

    .link {
      color: var(--accent);
      text-decoration: none;
      font-size: 17px;
      font-weight: 500;
      letter-spacing: 0.01em;
      padding: 4px 0;
      border-bottom: 1px solid transparent;
      transition: border-color 0.15s ease;
    }
    .link:hover {
      border-bottom-color: var(--accent);
    }
    .link .arrow {
      display: inline-block;
      margin-left: 6px;
      transition: transform 0.15s ease;
    }
    .link:hover .arrow {
      transform: translateX(3px);
    }

    footer {
      padding: 32px 24px;
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.7;
    }
    footer p { margin: 0; }

    @media (max-width: 640px) {
      .wordmark { font-size: 64px; }
      main { gap: 40px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="wordmark">DUNIN7</div>
    <a class="link" href="https://doneinseven.com">
      doneinseven.com <span class="arrow">→</span>
    </a>
  </main>
  <footer>
    <p>DUNIN7 — Done In Seven LLC</p>
    <p>Miami, Florida</p>
  </footer>
</body>
</html>
