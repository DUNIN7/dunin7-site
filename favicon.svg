<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- DUNIN7 favicon v0.3
       The "7" character set in IBM Plex Serif 600 — the same face and weight
       as the deployed dunin7.com wordmark.
       
       Falls back to Source Serif Pro → Georgia → Times → generic serif when
       Plex Serif isn't OS-installed (most user systems). All fallbacks render
       a serif numeral 7 with similar proportions to Plex Serif's 7, so the
       favicon stays serif-family even on systems without the primary face.
       
       Warm white ground (#FAF9F7) matches the deployed page background.
       Neutral near-black (#1A1A1A) matches the deployed wordmark color.
       No accent — the deployed wordmark uses none; the favicon as a 
       distillation of the wordmark follows the same discipline. -->
  <rect width="32" height="32" rx="5" fill="#FAF9F7"/>
  <text x="16" y="25" 
        text-anchor="middle"
        font-family="'IBM Plex Serif', 'Source Serif Pro', Georgia, 'Times New Roman', serif"
        font-size="26"
        font-weight="600"
        fill="#1A1A1A">7</text>
</svg>
